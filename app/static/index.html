<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>智能视觉报告生成与多模态质检系统</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--green:#10b981;--blue:#3b82f6;--purple:#8b5cf6;--red:#ef4444;--text:#e2e8f0;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:#0f172a;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;background:linear-gradient(90deg,var(--green),var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
nav{display:flex;gap:4px}
nav button{padding:8px 18px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;border-radius:6px 6px 0 0;transition:.2s}
nav button.active{background:var(--card);color:var(--green);border-bottom-color:var(--card)}
nav button:hover{color:var(--text)}
main{max-width:1200px;margin:0 auto;padding:24px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.card h2{font-size:16px;color:var(--green);margin-bottom:16px}
.upload-zone{border:2px dashed #1e3a2a;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:.2s}
.upload-zone:hover{border-color:var(--green);background:rgba(16,185,129,.05)}
.upload-zone input{display:none}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;transition:.2s}
.btn-green{background:var(--green);color:#000}.btn-green:hover{opacity:.9}.btn-green:disabled{opacity:.4;cursor:not-allowed}
.btn-blue{background:var(--blue);color:#fff}.btn-purple{background:var(--purple);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.result-grid img{width:100%;border-radius:8px;border:2px solid var(--border)}
table{width:100%;border-collapse:collapse;margin:12px 0}
th{text-align:left;padding:8px 12px;color:var(--green);font-size:12px;border-bottom:2px solid var(--border)}
td{padding:8px 12px;font-size:13px;border-bottom:1px solid rgba(30,41,59,.5)}
.provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.provider-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.provider-card h3{font-size:15px;margin-bottom:6px}
.provider-card .desc{color:var(--muted);font-size:13px;margin-bottom:12px}
.provider-card .meta{font-size:12px;color:var(--muted);margin:4px 0}
.provider-card.active{border-color:var(--green)}
.provider-card input{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;width:100%;margin:4px 0}
.provider-card select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px);width:100%;margin:4px 0}
.badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-ok{background:rgba(16,185,129,.2);color:var(--green)}
.badge-na{background:rgba(148,163,184,.15);color:var(--muted)}
.badge-err{background:rgba(239,68,68,.15);color:var(--red)}
.status{margin-left:8px}
.spinner{display:none;width:20px;height:20px;border:2px solid #333;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto;font-size:13px;line-height:1.6;max-height:600px;overflow-y:auto}
.toast{position:fixed;top:20px;right:20px;background:var(--red);color:#fff;padding:12px 20px;border-radius:8px;z-index:999;display:none}
</style>
</head><body>
<header>
  <h1>智能视觉报告生成与多模态质检系统</h1>
  <nav>
    <button class="active" onclick="switchPage('inspect')">检测报告</button>
    <button onclick="switchPage('providers')">模型配置</button>
  </nav>
</header>
<main>

<!-- ====== 检测报告页 ====== -->
<div class="page active" id="page-inspect">
  <div class="card">
    <h2>上传产品图像</h2>
    <div class="upload-zone" id="dropZone">
      <p style="font-size:48px;margin-bottom:8px">📸</p>
      <p>点击或拖拽上传产品图像</p><p style="color:var(--muted);font-size:12px">支持 JPG / PNG / BMP</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/bmp">
    </div>
    <div class="flex" style="margin-top:16px">
      <button class="btn btn-green" id="btnDetect" disabled>仅检测</button>
      <button class="btn btn-purple" id="btnReport" disabled>生成完整报告</button>
      <button class="btn btn-blue" id="btnQuality" disabled>质检判定</button>
      <button class="btn btn-outline" id="btnReset">清空</button>
      <div class="spinner" id="spinner"></div>
    </div>
    <div style="margin-top:12px">
      <label style="font-size:13px;color:var(--muted);margin-right:8px">质检参数:</label>
      单缺陷面积阈值 <input type="number" id="areaThresh" value="3" style="width:60px;padding:4px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px"> %
      总缺陷面积阈值 <input type="number" id="totalAreaThresh" value="5" style="width:60px;padding:4px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px"> %
      最大缺陷数 <input type="number" id="maxDefects" value="5" style="width:60px;padding:4px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px">
    </div>
  </div>
  <div id="results"></div>
</div>

<!-- ====== 模型配置页 ====== -->
<div class="page" id="page-providers">
  <div class="card">
    <h2>LLM 供应商管理</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">
      配置 API Key 后即可使用对应的大模型生成质检报告。Key 经 AES-256-CBC 加密存储，前端强制脱敏。
    </p>
    <div class="provider-grid" id="providerGrid">加载中...</div>
  </div>
</div>

</main>
<div class="toast" id="toast"></div>

<script>
// ---- 页面切换 ----
window.switchPage=function(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelector('nav button[onclick*="'+p+'"]').classList.add('active');
  if(p==='providers')loadProviders();
};

// ---- 上传 ----
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
let selectedFile=null,lastResult=null;
dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.style.borderColor='var(--green)'});
dropZone.addEventListener('dragleave',()=>dropZone.style.borderColor='');
dropZone.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',()=>{if(fileInput.files.length)handleFile(fileInput.files[0])});

function handleFile(f){
  if(!f.type.startsWith('image/')){toast('请上传图像文件');return}
  selectedFile=f;
  document.getElementById('btnDetect').disabled=false;
  document.getElementById('btnReport').disabled=false;
  document.getElementById('btnQuality').disabled=false;
  const reader=new FileReader();
  reader.onload=e=>{if(!document.getElementById('imgOrig')){document.getElementById('results').innerHTML='<div class="card result-grid"><div><h2>原始图像</h2><img id="imgOrig"></div><div id="contentRight"></div></div>'}document.getElementById('imgOrig').src=e.target.result}
  reader.readAsDataURL(f);
}

// ---- API 调用 ----
async function apiCall(url,btnId){
  if(!selectedFile)return;
  const btn=document.getElementById(btnId);
  const spinner=document.getElementById('spinner');
  btn.disabled=true;spinner.style.display='inline-block';
  const form=new FormData();form.append('file',selectedFile);
  if(btnId==='btnQuality'){
    form.append('area_threshold',document.getElementById('areaThresh').value);
    form.append('total_area_threshold',document.getElementById('totalAreaThresh').value);
    form.append('max_defects',document.getElementById('maxDefects').value);
  }
  try{
    const r=await fetch(url,{method:'POST',body:form}),data=await r.json();
    lastResult=data;
    if(btnId==='btnDetect')showDetectResult(data);
    else if(btnId==='btnReport')showReportResult(data);
    else showQualityResult(data);
  }catch(e){toast('请求失败: '+e.message)}
  finally{btn.disabled=false;spinner.style.display='none'}
}

document.getElementById('btnDetect').addEventListener('click',()=>apiCall('/api/v1/detect','btnDetect'));
document.getElementById('btnReport').addEventListener('click',()=>apiCall('/api/v1/generate-report','btnReport'));
document.getElementById('btnQuality').addEventListener('click',()=>apiCall('/api/v1/quality-check','btnQuality'));
document.getElementById('btnReset').addEventListener('click',()=>{selectedFile=null;fileInput.value='';document.getElementById('btnDetect').disabled=true;document.getElementById('btnReport').disabled=true;document.getElementById('btnQuality').disabled=true;document.getElementById('results').innerHTML=''});

// ---- 结果展示 ----
function showDetectResult(d){
  const dets=d.detections||[],rows=dets.map(x=>`<tr><td>${x.class}</td><td>${x.confidence.toFixed(2)}</td><td>(${x.bbox.join(',')})</td><td>${x.area_pct}%</td></tr>`).join('');
  document.getElementById('contentRight').innerHTML=`
    <h2>检测结果</h2>
    <p style="color:var(--muted)">检测到 <b style="color:var(--green)">${d.total_defects}</b> 处缺陷 | ${d.inference_time_ms}ms</p>
    <table><tr><th>类型</th><th>置信度</th><th>位置</th><th>面积</th></tr>${rows||'<tr><td colspan=4>未检测到缺陷</td></tr>'}</table>
    ${d.class_summary?`<p style="font-size:13px;color:var(--muted);margin-top:8px">类别分布: ${JSON.stringify(d.class_summary)}</p>`:''}`;
}
function showReportResult(d){
  showDetectResult(d.detection);
  if(d.report&&d.report.html){document.getElementById('contentRight').innerHTML+=`<h2 style="margin-top:16px">AI 报告</h2><div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;max-height:500px;overflow-y:auto">${d.report.html}</div>`}
  if(d.quality){document.getElementById('contentRight').innerHTML+=`<p style="margin-top:12px;font-size:16px">判定: <b style="color:${d.quality.verdict==='合格'?'var(--green)':'var(--red)'}">${d.quality.verdict}</b> (${d.quality.method})</p>`}
}
function showQualityResult(d){
  showDetectResult(d.detection);
  const q=d.quality||{};
  document.getElementById('contentRight').innerHTML+=`
    <div class="card" style="margin-top:16px;border-color:${q.verdict==='合格'?'var(--green)':'var(--red)'}">
      <h2 style="color:${q.verdict==='合格'?'var(--green)':'var(--red)'}">判定: ${q.verdict} (${q.method||'规则引擎'})</h2>
      ${q.details?`<p style="color:var(--muted);font-size:13px">总面积: ${q.details.total_area_pct}% | 最大单缺陷: ${q.details.max_single_area_pct}% | 缺陷数: ${q.details.defect_count}</p>`:''}
      ${q.failures&&q.failures.length?`<p style="color:var(--red);font-size:13px;margin-top:8px">${q.failures.join('<br>')}</p>`:''}
      ${q.reason?`<p style="margin-top:8px">${q.reason}</p>`:''}
      ${q.actions?`<p style="color:var(--green);margin-top:8px">建议: ${[q.actions].flat().join('; ')}</p>`:''}
    </div>`;
}

// ---- 供应商管理 ----
async function loadProviders(){
  try{
    const r=await fetch('/api/v1/providers'),providers=await r.json();
    document.getElementById('providerGrid').innerHTML=providers.map(p=>`
      <div class="provider-card ${p.is_active?'active':''}" id="card-${p.provider}">
        <h3>${p.name} ${p.is_active?'<span class="badge badge-ok">已激活</span>':(p.has_key?'<span class="badge badge-na">已配置</span>':'<span class="badge badge-na">未配置</span>')}</h3>
        <p class="desc">${p.desc}</p>
        <p class="meta">💰 ${p.pricing}</p>
        <p class="meta">🔑 Key: ${p.api_key_masked||'未设置'}</p>
        <input type="password" placeholder="输入 API Key" id="key-${p.provider}" value="" style="margin-top:8px">
        <select id="model-${p.provider}">${(p.available_models||[]).map(m=>`<option ${m===p.model?'selected':''}>${m}</option>`).join('')}</select>
        <input type="text" placeholder="Base URL" id="url-${p.provider}" value="${p.base_url||''}">
        <div class="flex" style="margin-top:8px">
          <button class="btn btn-green btn-sm" onclick="saveProvider('${p.provider}')">💾 保存</button>
          <button class="btn btn-blue btn-sm" onclick="testProvider('${p.provider}')">🧪 测试</button>
        </div>
        <div id="status-${p.provider}" class="status"></div>
      </div>`).join('');
  }catch(e){document.getElementById('providerGrid').innerHTML='加载失败: '+e.message}
}

async function saveProvider(provider){
  const key=document.getElementById('key-'+provider).value;
  const model=document.getElementById('model-'+provider).value;
  const url=document.getElementById('url-'+provider).value;
  try{
    const r=await fetch('/api/v1/providers/'+provider,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key,model:model,base_url:url})});
    const d=await r.json();
    if(d.ok){document.getElementById('status-'+provider).innerHTML='<span class="badge badge-ok">已保存</span>';loadProviders()}
  }catch(e){toast('保存失败')}
}

async function testProvider(provider){
  document.getElementById('status-'+provider).innerHTML='<span class="spinner" style="display:inline-block"></span>';
  try{
    const r=await fetch('/api/v1/providers/'+provider+'/test',{method:'POST'});
    const d=await r.json();
    document.getElementById('status-'+provider).innerHTML=d.ok?`<span class="badge badge-ok">✅ ${d.latency_ms}ms - ${d.reply}</span>`:`<span class="badge badge-err">❌ ${d.error}</span>`;
  }catch(e){document.getElementById('status-'+provider).innerHTML='<span class="badge badge-err">请求失败</span>'}
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
</script>
</body></html>
